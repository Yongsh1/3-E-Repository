<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sun Son Solar | Login & Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(20, 184, 166, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(45, 212, 191, 0.12),
                    transparent 30%
                ),
                #f4f8f7;

            color: #1f2937;
        }


        

        .auth-container {
            width: 100%;
            max-width: 1050px;
            min-height: 620px;

            display: grid;
            grid-template-columns: 45% 55%;

            background: #ffffff;

            border-radius: 24px;
            overflow: hidden;

            box-shadow:
                0 20px 60px rgba(15, 118, 110, 0.10);
        }


      

        .visual-panel {
            position: relative;
            overflow: hidden;

            min-height: 620px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #0f9f90,
                    #14b8a6,
                    #2dd4bf
                );
        }


        
        .visual-panel::before {
            content: "";

            position: absolute;

            width: 330px;
            height: 330px;

            border-radius: 50%;

            top: -130px;
            right: -110px;

            background: rgba(255, 255, 255, 0.09);
        }


       
        .visual-panel::after {
            content: "";

            position: absolute;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            bottom: -130px;
            left: -120px;

            background: rgba(255, 255, 255, 0.08);
        }



        .decor-square {
            position: absolute;

            width: 38px;
            height: 38px;

            top: 42px;
            left: 50px;

            border-radius: 11px;

            background: rgba(255, 255, 255, 0.16);

            backdrop-filter: blur(10px);

            z-index: 2;
        }


        

        .solar-label {
            position: relative;

            z-index: 3;

            width: 100%;

            padding: 30px;

            text-align: center;

            color: white;
        }


        .solar-label h1 {
            font-size: 40px;

            font-weight: 700;

            line-height: 1.1;

            letter-spacing: -1.5px;

            margin-bottom: 10px;

            text-shadow:
                0 3px 15px rgba(0, 80, 75, 0.15);
        }


        .solar-label p {
            font-size: 14px;

            font-weight: 400;

            letter-spacing: 1px;

            color: rgba(255, 255, 255, 0.82);
        }


      

        .form-panel {
            padding: 48px 70px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .form-container {
            width: 100%;
            max-width: 390px;
        }


        
        .form-header {
            margin-bottom: 28px;
        }


        .form-header h2 {
            font-size: 28px;

            letter-spacing: -1px;

            margin-bottom: 8px;

            color: #17201f;
        }


        .form-header p {
            color: #858d8b;

            font-size: 14px;

            line-height: 1.6;
        }


        
        .input-group {
            margin-bottom: 16px;
        }


        .input-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color: #3f4947;
        }


        .input {
            width: 100%;

            height: 49px;

            padding: 0 14px;

            border: 1px solid #dfe7e5;

            border-radius: 10px;

            outline: none;

            background: #fafcfb;

            color: #26302e;

            font-size: 14px;

            transition: 0.2s ease;
        }


        .input::placeholder {
            color: #a7aeac;
        }


        .input:focus {
            border-color: #14b8a6;

            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(20, 184, 166, 0.10);
        }


       

        .form-options {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin: 5px 0 20px;

            font-size: 12px;
        }


        .remember {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #7d8684;
        }


        .remember input {
            accent-color: #14b8a6;

            cursor: pointer;
        }


        .forgot {
            color: #0f9f90;

            font-weight: 600;

            text-decoration: none;
        }


        .forgot:hover {
            text-decoration: underline;
        }


        
        .primary-button {
            width: 100%;

            height: 49px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #0f9f90,
                    #14b8a6
                );

            color: white;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

            box-shadow:
                0 8px 20px rgba(20, 184, 166, 0.20);
        }


        .primary-button:hover {
            background:
                linear-gradient(
                    135deg,
                    #0c8f82,
                    #10a99a
                );

            box-shadow:
                0 12px 25px rgba(20, 184, 166, 0.25);

            transform: translateY(-1px);
        }


       

        .divider {
            display: flex;

            align-items: center;

            gap: 13px;

            margin: 24px 0;

            color: #a0a8a6;

            font-size: 9px;

            letter-spacing: 0.5px;
        }


        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            flex: 1;

            background: #e8edeb;
        }


        

        .switch {
            text-align: center;

            margin-top: 23px;

            font-size: 12px;

            color: #8b9391;
        }


        .switch a {
            color: #0f9f90;

            text-decoration: none;

            font-weight: 700;

            margin-left: 4px;
        }


        .switch a:hover {
            text-decoration: underline;
        }


        

        .register-form {
            margin-top: 30px;

            padding-top: 30px;

            border-top: 1px solid #edf0ef;
        }


        .register-form h3 {
            font-size: 15px;

            margin-bottom: 17px;

            color: #303836;
        }


        

        @media (max-width: 850px) {

            .auth-container {
                grid-template-columns: 1fr;

                max-width: 500px;
            }


            .visual-panel {
                min-height: 200px;
            }


            .solar-label h1 {
                font-size: 34px;
            }


            .form-panel {
                padding: 45px 35px;
            }
        }


        @media (max-width: 480px) {

            body {
                padding: 12px;
            }


            .auth-container {
                border-radius: 18px;
            }


            .visual-panel {
                min-height: 170px;
            }


            .decor-square {
                top: 30px;
                left: 30px;

                width: 32px;
                height: 32px;
            }


            .solar-label h1 {
                font-size: 29px;
            }


            .solar-label p {
                font-size: 12px;
            }


            .form-panel {
                padding: 35px 22px;
            }
        }
    </style>
</head>


<body>

    <div class="auth-container">



        <section class="visual-panel">

            <div class="decor-square"></div>


            <div class="solar-label">

                <h1>
                    Sun Son Solar
                </h1>

               

            </div>

        </section>


        

        <section class="form-panel">

            <div class="form-container">


                

                <div class="form-header">

                    <h2>
                        Login/Signup
                    </h2>

                </div>


                
                <form>


                    

                    <div class="input-group">

                        <label>
                            Email address
                        </label>

                        <input
                            class="input"
                            type="email"
                            placeholder="Enter your email"
                        >

                    </div>


                    

                    <div class="input-group">

                        <label>
                            Password
                        </label>

                        <input
                            class="input"
                            type="password"
                            placeholder="Enter your password"
                        >

                    </div>


                    

                    <div class="form-options">

                        <label class="remember">

                            <input type="checkbox">

                            Remember me

                        </label>


                        <a
                            href="#"
                            class="forgot"
                        >
                            Forgot password?
                        </a>

                    </div>


                   

                    <button
                        class="primary-button"
                        type="button"
                    >
                        Sign in
                    </button>

                </form>


                

                <div class="divider">

                    OR CONTINUE WITH

                </div>


               
                <div class="switch">

                    Don't have an account?

                    <a href="#">
                        Create account
                    </a>

                </div>


               
                <div class="register-form">

                    <h3>
                        Create your account
                    </h3>


                   

                    <div class="input-group">

                        <label>
                            Full name
                        </label>

                        <input
                            class="input"
                            type="text"
                            placeholder="Enter your name"
                        >

                    </div>


                   
                    <div class="input-group">

                        <label>
                            Email address
                        </label>

                        <input
                            class="input"
                            type="email"
                            placeholder="Enter your email"
                        >

                    </div>


                    

                    <div class="input-group">

                        <label>
                            Password
                        </label>

                        <input
                            class="input"
                            type="password"
                            placeholder="Enter your password"
                        >

                    </div>


                    

                    <button
                        class="primary-button"
                        type="button"
                    >
                        Create account
                    </button>

                </div>

            </div>

        </section>

    </div>

</body>
</html>
